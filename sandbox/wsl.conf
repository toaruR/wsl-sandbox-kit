[boot]
systemd = true

# automount はホスト側から \\wsl.localhost\<distro> でアクセスするため有効にする
# (共有を担う plan9 サーバーが automount 設定に連動して起動する。interop は無関係)。
# ホストドライブ (C:/D: 等) のマウントは provision.sh が入れる systemd ユニットが
# boot のたびに unmount して打ち消す(agent に sudo は無いので再マウント不可)
[automount]
enabled = true
mountFsTab = false

[interop]
enabled = false
appendWindowsPath = false

[user]
default = agent
